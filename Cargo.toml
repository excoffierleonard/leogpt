[package]
name = "leogpt"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = "1.142.0"
base64 = "0.23.1"
chrono = "0.4.45"
data-url = "0.3.2"
dotenvy = "0.15.7"
env_logger = "0.11.11"
eventsource-stream = "0.2.3"
futures = "0.3.34"
fuzzy-matcher = "0.3.7"
hound = "3.5.1"
log = "0.4.33"
mime = "0.3.17"
mime_guess = "2.0.5"
poise = "0.6.2"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
# songbird 0.6.0 is pinned to reqwest 0.12; kept alongside our 0.13 client
# solely to build the `reqwest::Client` that `songbird::input::HttpRequest`
# requires (see src/music/playback.rs).
reqwest_legacy = { package = "reqwest", version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
rustls = { version = "0.23.43", features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
songbird = { version = "0.6.0", features = ["builtin-queue"] }
strsim = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["flac"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"

[lints.clippy]
pedantic = "warn"
